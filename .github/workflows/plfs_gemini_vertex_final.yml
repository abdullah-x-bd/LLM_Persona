name: PLFS Gemini retired

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/plfs_gemini_vertex_final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plfs-final-repair-v1
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gemini has been removed from the study. No Gemini inference will run."
