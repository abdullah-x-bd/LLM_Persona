# diagnose current post-repair CAMS Gemini single failure
name: CAMS Gemini single-failure diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cams_gemini_failure_diag.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  SOURCE_RUN_ID: '33290298082'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography numpy pandas json-repair
      - name: Restore current 24-of-25 chunk zero checkpoint
        run: |
          mkdir -p /tmp/previous /tmp/prod
          AID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="cams-final-gemini-0") | .id' | head -n1)
          test -n "$AID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" > /tmp/checkpoint.zip
          unzip -q /tmp/checkpoint.zip -d /tmp/previous
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'src')
          from production_runtime import decrypt_result_file
          files=list(Path('/tmp/previous').rglob('*.results.enc.b64'))
          assert len(files)==1, files
          Path('/tmp/prod/results.jsonl').write_bytes(decrypt_result_file(files[0],0))
          PY
      - name: Reconstruct exact frozen chunk zero
        run: |
          python src/production_runtime.py requests --bundle data/encrypted/cams_codes_v2.x25519.aesgcm.gz.b64 --out-requests /tmp/prod/requests.jsonl --out-schema /tmp/prod/schema.json --chunk 0 --chunk-size 25
      - name: Make one corrected resilient diagnostic attempt
        continue-on-error: true
        run: |
          python src/run_openrouter_gemini_resilient.py --requests /tmp/prod/requests.jsonl --schema /tmp/prod/schema.json --out /tmp/prod/results.jsonl --checkpoint /tmp/prod/checkpoint.json --errors /tmp/prod/errors.jsonl --model google/gemini-3.7-flash --provider google-vertex --concurrency 1 --max-retries 0
      - name: Print exact remaining exception only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/prod/errors.jsonl')
          if not p.exists() or not p.stat().st_size:
              print('GEMINI_POST_REPAIR_ERROR=NONE')
              print('RESULT_BECAME_COMPLETE=TRUE')
          else:
              x=json.loads(p.read_text().splitlines()[-1])
              print('GEMINI_POST_REPAIR_ERROR=' + str(x.get('error')))
              print('ATTEMPTS=' + str(x.get('attempts')))
          PY
