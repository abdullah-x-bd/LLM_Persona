name: Reasoning population paid pilot

on:
  push:
    paths:
      - 'reasoning_population_fidelity/run_triggers/PAID_PILOT_V2'

permissions:
  contents: read

jobs:
  paid-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas cryptography
      - name: Recheck live model metadata without inference
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python reasoning_population_fidelity/src/online_preflight.py
      - name: Run 1 respondent paid canary
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RPF_ENABLE_PILOT: YES_I_ACCEPT_PILOT_COST
        run: |
          rm -rf /tmp/rpf_canary
          python reasoning_population_fidelity/src/paid_pilot.py --respondents 1 --spend-cap 0.01 --workdir /tmp/rpf_canary
      - name: Upload canary engineering artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpf-paid-canary-v2
          path: /tmp/rpf_canary/pilot_output/
          retention-days: 30
      - name: Gate 20 respondent pilot on canary
        run: |
          python - <<'PY'
          import json
          p='/tmp/rpf_canary/pilot_output/engineering_summary.json'
          x=json.load(open(p))
          assert x['all_schema_valid'] is True, x
          assert x['requests_schema_valid'] == 3, x
          assert x['failures'] == 0 and x['parse_failures'] == 0, x
          print('CANARY_GATE_PASS')
          PY
      - name: Run 20 respondent engineering pilot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RPF_ENABLE_PILOT: YES_I_ACCEPT_PILOT_COST
        run: |
          rm -rf /tmp/rpf_pilot20
          python reasoning_population_fidelity/src/paid_pilot.py --respondents 20 --spend-cap 0.16 --workdir /tmp/rpf_pilot20
      - name: Upload 20 respondent engineering artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpf-paid-pilot20-v2
          path: /tmp/rpf_pilot20/pilot_output/
          retention-days: 30
      - name: Final engineering gate
        run: |
          python - <<'PY'
          import json
          p='/tmp/rpf_pilot20/pilot_output/engineering_summary.json'
          x=json.load(open(p))
          assert x['all_schema_valid'] is True, x
          assert x['requests_schema_valid'] == 60, x
          assert x['failures'] == 0 and x['parse_failures'] == 0, x
          assert x['known_realized_cost_usd'] is None or x['known_realized_cost_usd'] <= 0.16, x
          print('PAID_PILOT_GATE_PASS')
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
