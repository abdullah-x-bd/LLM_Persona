name: CAMS Gemini retired

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cams_final_gemini_repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cams-final-gemini-repair-v1
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gemini has been removed from the study. No Gemini inference will run."
