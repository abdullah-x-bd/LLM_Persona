name: Final research artifact QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final_qa.yml'
      - 'analysis_final/**'
      - 'CITATION.cff'
      - 'LICENSE'
      - 'LICENSE-CONTENT.md'
      - 'docs/SCIENTIFIC_FREEZE.md'
      - 'docs/FINAL_PROVENANCE.md'
      - 'docs/REPO_MAP.md'
      - 'docs/REPO_WIDE_RESULTS_SYNTHESIS.md'
      - 'docs/RELEASE_NOTES_v1.0.0.md'
      - 'docs/RELEASE_v1.0.0.md'
      - 'README.md'
      - 'studies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependency
        run: pip install pandas
      - name: Run final repository freeze gate
        id: freeze_gate
        shell: bash
        run: |
          set +e
          python analysis_final/final_qa.py > final_qa.log 2>&1
          code=$?
          cat final_qa.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload QA diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-research-artifact-qa-log
          path: final_qa.log
          retention-days: 30
          if-no-files-found: error
      - name: Enforce repository freeze gate
        run: test "${{ steps.freeze_gate.outputs.exit_code }}" = "0"
      - name: Confirm zero-inference final package
        run: |
          set -euo pipefail
          ! grep -R -E '/chat/completions|requests\.post|urlopen\(' \
            analysis_final/unified_analysis.py \
            analysis_final/recover_legacy.py \
            analysis_final/finalize_outputs.py \
            analysis_final/final_qa.py
          test -d analysis_final/results
          test -d analysis_final/figures
          echo FINAL_RESEARCH_ARTIFACT_FREEZE_PASS
