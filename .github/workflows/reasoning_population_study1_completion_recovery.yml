name: Reasoning population Study 1 completion recovery

on:
  push:
    paths:
      - 'reasoning_population_fidelity/run_triggers/STUDY1_COMPLETION_RECOVERY_V1'

permissions:
  contents: read
  actions: read

jobs:
  completion-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas cryptography
      - name: Download 2899-response preserved checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/rpf_seed /tmp/rpf_completion
          mkdir -p /tmp/rpf_seed /tmp/rpf_completion
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9737889565/zip \
            -o /tmp/rpf_seed.zip
          unzip -q /tmp/rpf_seed.zip -d /tmp/rpf_seed
          python - <<'PY'
          import json
          x=json.load(open('/tmp/rpf_seed/study1_summary.json'))
          assert x['freeze_requests_sha256'] == '120cc6bef15e7b2eb8fb2c49c7efa2fab5496b0a429cf34c8d9100b588cf9293', x
          assert x['requests_schema_valid'] == 2899, x
          assert x['remaining_failures'] == 101, x
          assert x['condition_valid_counts'] == {'off':1000,'low':939,'medium':960}, x
          print('COMPLETION_SEED_OK')
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
      - name: Compile completion recovery code
        run: python -m compileall -q reasoning_population_fidelity/src
      - name: Recheck live model metadata without inference
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python reasoning_population_fidelity/src/online_preflight.py
      - name: Complete only the remaining frozen Study 1 requests
        id: recovery
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RPF_ENABLE_STUDY1_RESUME: YES_I_ACCEPT_STUDY1_RESUME_COST
        run: |
          python reasoning_population_fidelity/src/resume_study1_completion_recovery.py \
            --seed-dir /tmp/rpf_seed \
            --workdir /tmp/rpf_completion
      - name: Upload final combined encrypted Study 1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpf-study1-completion-recovery-v1
          path: /tmp/rpf_completion/study1_resume_output/
          retention-days: 30
      - name: Final Study 1 integrity gate
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p='/tmp/rpf_completion/study1_resume_output/study1_summary.json'
          if not os.path.exists(p):
              raise SystemExit('completion recovery produced no durable summary')
          x=json.load(open(p))
          note=json.load(open('/tmp/rpf_completion/study1_resume_output/completion_recovery_note.json'))
          assert x['freeze_requests_sha256'] == '120cc6bef15e7b2eb8fb2c49c7efa2fab5496b0a429cf34c8d9100b588cf9293', x
          assert x['requests_planned'] == 3000, x
          assert x['requests_schema_valid'] == 3000, x
          assert x['remaining_failures'] == 0, x
          assert x['all_schema_valid'] is True, x
          assert x['condition_valid_counts'] == {'off':1000,'low':1000,'medium':1000}, x
          assert x['provider_order'] == ['akashml/fp8'], x
          assert x['allow_provider_fallbacks'] is False, x
          assert x['provider_data_collection'] == 'deny', x
          assert float(x['combined_realized_or_guard_cost_usd']) <= 8.50 + 1e-12, x
          assert note['frozen_study_budget_cap_usd'] == 7.80, note
          assert note['operational_recovery_cap_usd'] == 8.50, note
          assert note['interim_outcomes_seen_before_recovery'] is True, note
          assert note['changes_to_scientific_design'] is False, note
          print('STUDY1_FINAL_3000_GATE_PASS')
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
