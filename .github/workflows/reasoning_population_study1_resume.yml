name: Reasoning population Study 1 resume

on:
  push:
    paths:
      - 'reasoning_population_fidelity/run_triggers/STUDY1_RESUME_RUN_V1'

permissions:
  contents: read
  actions: read

jobs:
  resume-study1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas cryptography
      - name: Download latest preserved Study 1 checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/rpf_seed /tmp/rpf_resume /tmp/rpf_resume_precheck
          mkdir -p /tmp/rpf_seed /tmp/rpf_resume /tmp/rpf_resume_precheck
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9736843943/zip \
            -o /tmp/rpf_seed.zip
          unzip -q /tmp/rpf_seed.zip -d /tmp/rpf_seed
          test -f /tmp/rpf_seed/study1_summary.json
          test -f /tmp/rpf_seed/production_requests.json
          test -f /tmp/rpf_seed/raw_results.enc.b64
          python - <<'PY'
          import json
          x=json.load(open('/tmp/rpf_seed/study1_summary.json'))
          assert x['freeze_requests_sha256'] == '120cc6bef15e7b2eb8fb2c49c7efa2fab5496b0a429cf34c8d9100b588cf9293', x
          assert x['requests_schema_valid'] == 2574, x
          assert x['remaining_failures'] == 426, x
          print('LATEST_SEED_CHECKPOINT_OK')
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
      - name: Compile resume code
        run: python -m compileall -q reasoning_population_fidelity/src
      - name: Recheck live model metadata without inference
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python reasoning_population_fidelity/src/online_preflight.py
      - name: Choose safe resume speed from live credit without inference
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'reasoning_population_fidelity/src')
          from resume_study1 import run
          x = run(Path('/tmp/rpf_seed'), Path('/tmp/rpf_resume_precheck'), True)
          fast = x.get('status') == 'RESUME_PREFLIGHT_PASS_FULL'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('RPF_FAST_RESUME=' + ('1' if fast else '0') + '\n')
          print('FAST_RESUME=' + str(fast))
          PY
      - name: Configure full-speed resume when fully funded
        run: |
          if [ "${RPF_FAST_RESUME}" = "1" ]; then
            sed -i 's/^RESUME_CONCURRENCY = 2$/RESUME_CONCURRENCY = 8/' reasoning_population_fidelity/src/resume_study1.py
            sed -i 's/^BATCH_SIZE = 12$/BATCH_SIZE = 48/' reasoning_population_fidelity/src/resume_study1.py
            echo 'Using full-speed resume: concurrency=8, batch_size=48'
          else
            echo 'Using partial-credit resume: concurrency=2, batch_size=12'
          fi
          python -m compileall -q reasoning_population_fidelity/src
      - name: Resume only the missing frozen Study 1 requests
        id: resume
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RPF_ENABLE_STUDY1_RESUME: YES_I_ACCEPT_STUDY1_RESUME_COST
        run: |
          python reasoning_population_fidelity/src/resume_study1.py \
            --seed-dir /tmp/rpf_seed \
            --workdir /tmp/rpf_resume
      - name: Upload combined encrypted resumed Study 1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpf-study1-resumed-combined-v2
          path: /tmp/rpf_resume/study1_resume_output/
          retention-days: 30
      - name: Classify resumed Study 1 checkpoint
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p='/tmp/rpf_resume/study1_resume_output/study1_summary.json'
          if not os.path.exists(p):
              raise SystemExit('resume produced no durable summary')
          x=json.load(open(p))
          assert x['requests_planned'] == 3000, x
          assert x['freeze_requests_sha256'] == '120cc6bef15e7b2eb8fb2c49c7efa2fab5496b0a429cf34c8d9100b588cf9293', x
          assert x['requests_schema_valid'] >= 2574, x
          assert x['provider_order'] == ['akashml/fp8'], x
          assert x['allow_provider_fallbacks'] is False, x
          assert x['provider_data_collection'] == 'deny', x
          assert x['combined_realized_or_guard_cost_usd'] <= 7.80, x
          if x['all_schema_valid']:
              assert x['requests_schema_valid'] == 3000, x
              assert x['remaining_failures'] == 0, x
              assert x['condition_valid_counts'] == {'off':1000,'low':1000,'medium':1000}, x
              print('STUDY1_RESUME_FINAL_GATE_PASS')
          else:
              reason=str(x.get('stop_reason') or '')
              assert reason.startswith('account_credit_floor_reached:'), x
              print('STUDY1_PARTIAL_CHECKPOINT_PASS')
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
