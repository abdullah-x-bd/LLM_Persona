name: Reasoning population Study 1 interim analysis

on:
  push:
    paths:
      - 'reasoning_population_fidelity/run_triggers/STUDY1_INTERIM_ANALYSIS_V1'

permissions:
  contents: read
  actions: read

jobs:
  interim-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas cryptography
      - name: Download 2574-response checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/rpf_interim_seed /tmp/rpf_interim && mkdir -p /tmp/rpf_interim_seed /tmp/rpf_interim
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9736843943/zip \
            -o /tmp/rpf_interim_seed.zip
          unzip -q /tmp/rpf_interim_seed.zip -d /tmp/rpf_interim_seed
          python - <<'PY'
          import json
          x=json.load(open('/tmp/rpf_interim_seed/study1_summary.json'))
          assert x['requests_schema_valid'] == 2574, x
          assert x['remaining_failures'] == 426, x
          assert x['freeze_requests_sha256'] == '120cc6bef15e7b2eb8fb2c49c7efa2fab5496b0a429cf34c8d9100b588cf9293', x
          print('INTERIM_SEED_OK')
          PY
      - name: Run aggregate interim analysis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python reasoning_population_fidelity/analysis/interim_checkpoint_analysis.py \
            --seed-dir /tmp/rpf_interim_seed \
            --out /tmp/rpf_interim/interim_report.json
      - name: Upload aggregate interim report
        uses: actions/upload-artifact@v4
        with:
          name: rpf-study1-interim-aggregate-v1
          path: /tmp/rpf_interim/interim_report.json
          retention-days: 30
