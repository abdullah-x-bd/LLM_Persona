name: CMS Gemini retired

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cms_gemini_fast_repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-final-repair-v1
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gemini has been removed from the study. No Gemini inference will run."
