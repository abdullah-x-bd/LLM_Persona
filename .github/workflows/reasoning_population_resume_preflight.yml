name: Reasoning population Study 1 resume preflight

on:
  push:
    paths:
      - 'reasoning_population_fidelity/run_triggers/STUDY1_RESUME_PREFLIGHT_V1'

permissions:
  contents: read
  actions: read

jobs:
  resume-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas cryptography
      - name: Download preserved Study 1 checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/rpf_seed /tmp/rpf_resume && mkdir -p /tmp/rpf_seed /tmp/rpf_resume
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9732220571/zip \
            -o /tmp/rpf_seed.zip
          unzip -q /tmp/rpf_seed.zip -d /tmp/rpf_seed
          test -f /tmp/rpf_seed/study1_summary.json
          test -f /tmp/rpf_seed/production_requests.json
          test -f /tmp/rpf_seed/raw_results.enc.b64
      - name: Compile resume code
        run: python -m compileall -q reasoning_population_fidelity/src
      - name: Verify exact checkpoint and calculate resume requirement without inference
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python reasoning_population_fidelity/src/resume_study1.py \
            --seed-dir /tmp/rpf_seed \
            --workdir /tmp/rpf_resume \
            --preflight-only
